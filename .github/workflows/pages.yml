name: Deploy Cloudflare site

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'worker/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-site
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: cloudflare
      url: https://capsomnia.com
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build:site
      - run: npm test
      - name: Check generated site CSS
        run: git diff --exit-code -- docs/styles.css
      - name: Deploy to Cloudflare
        run: |
          npx wrangler versions upload --tag "$GITHUB_SHA"
          npx wrangler versions deploy --version-tag "$GITHUB_SHA@100%" --yes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
